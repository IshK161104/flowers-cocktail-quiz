<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>🌸 FLOWERS カクテルクイズ</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #0d0d1a;
    --card: #1a1a2e;
    --card2: #16213e;
    --accent: #e91e8c;
    --accent2: #9b59b6;
    --gold: #f1c40f;
    --green: #2ecc71;
    --red: #e74c3c;
    --text: #f0f0f0;
    --sub: #aaa;
    --border: rgba(233,30,140,0.3);
  }

  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* ===== SCREENS ===== */
  .screen { display: none; min-height: 100vh; padding: 20px; }
  .screen.active { display: flex; flex-direction: column; }

  /* ===== HOME ===== */
  #home {
    align-items: center;
    justify-content: center;
    text-align: center;
    background: radial-gradient(ellipse at top, #1a0533 0%, #0d0d1a 70%);
  }

  .logo-area { margin-bottom: 40px; }
  .logo-icon { font-size: 72px; margin-bottom: 10px; animation: float 3s ease-in-out infinite; }
  @keyframes float { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-12px)} }
  .logo-title { font-size: 32px; font-weight: 900; background: linear-gradient(135deg, #e91e8c, #9b59b6); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
  .logo-sub { font-size: 14px; color: var(--sub); margin-top: 6px; letter-spacing: 2px; }

  .stats-row { display: flex; gap: 16px; margin-bottom: 40px; }
  .stat-box { background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 14px 24px; flex: 1; }
  .stat-num { font-size: 28px; font-weight: 800; color: var(--accent); }
  .stat-label { font-size: 11px; color: var(--sub); margin-top: 2px; }

  .menu-btn {
    width: 100%; padding: 18px; border-radius: 16px; border: none; font-size: 17px;
    font-weight: 700; margin-bottom: 12px; cursor: pointer; transition: all 0.2s;
    display: flex; align-items: center; justify-content: center; gap: 10px;
  }
  .menu-btn:active { transform: scale(0.97); }
  .btn-primary { background: linear-gradient(135deg, #e91e8c, #9b59b6); color: white; }
  .btn-secondary { background: var(--card); color: var(--text); border: 1px solid var(--border); }
  .btn-gold { background: linear-gradient(135deg, #f39c12, #e67e22); color: white; }

  /* ===== SETTINGS ===== */
  #settings { background: var(--bg); }
  .page-header { display: flex; align-items: center; gap: 12px; margin-bottom: 28px; padding-top: 10px; }
  .back-btn { background: var(--card); border: none; color: var(--text); width: 40px; height: 40px; border-radius: 12px; font-size: 18px; cursor: pointer; }
  .page-title { font-size: 22px; font-weight: 800; }

  .settings-section { margin-bottom: 24px; }
  .section-label { font-size: 12px; color: var(--sub); letter-spacing: 1px; margin-bottom: 10px; text-transform: uppercase; }

  .toggle-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .toggle-item {
    background: var(--card); border: 2px solid transparent; border-radius: 12px;
    padding: 12px; cursor: pointer; transition: all 0.2s; text-align: center;
    font-size: 13px; font-weight: 600;
  }
  .toggle-item.on { border-color: var(--accent); background: rgba(233,30,140,0.15); color: var(--accent); }
  .toggle-item .ti-icon { font-size: 22px; margin-bottom: 4px; }

  .q-count-row { display: flex; gap: 8px; }
  .q-num {
    flex: 1; padding: 12px; background: var(--card); border: 2px solid transparent;
    border-radius: 12px; text-align: center; cursor: pointer; font-size: 15px; font-weight: 700; transition: all 0.2s;
  }
  .q-num.on { border-color: var(--accent); color: var(--accent); background: rgba(233,30,140,0.15); }

  /* ===== QUIZ ===== */
  #quiz { background: var(--bg); justify-content: flex-start; padding: 16px; }

  .quiz-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; }
  .quiz-progress-text { font-size: 13px; color: var(--sub); }
  .progress-bar-wrap { height: 6px; background: var(--card); border-radius: 99px; margin-bottom: 20px; overflow: hidden; }
  .progress-bar-fill { height: 100%; background: linear-gradient(90deg, #e91e8c, #9b59b6); border-radius: 99px; transition: width 0.4s ease; }

  .score-badge { background: var(--card); border: 1px solid var(--border); border-radius: 20px; padding: 4px 14px; font-size: 13px; font-weight: 700; color: var(--gold); }

  .q-type-badge {
    display: inline-block; font-size: 11px; padding: 3px 10px; border-radius: 99px;
    margin-bottom: 10px; font-weight: 700; letter-spacing: 1px;
  }
  .badge-mc { background: rgba(233,30,140,0.2); color: var(--accent); }
  .badge-text { background: rgba(155,89,182,0.2); color: #bb8fce; }
  .badge-fill { background: rgba(46,204,113,0.2); color: var(--green); }

  .q-card {
    background: var(--card); border: 1px solid var(--border); border-radius: 20px;
    padding: 20px; margin-bottom: 16px;
  }
  .q-label { font-size: 12px; color: var(--sub); margin-bottom: 8px; }
  .q-text { font-size: 19px; font-weight: 800; line-height: 1.5; }
  .q-text .highlight { color: var(--accent); }

  /* 4択 */
  .choices { display: flex; flex-direction: column; gap: 10px; margin-bottom: 16px; }
  .choice-btn {
    background: var(--card2); border: 2px solid rgba(255,255,255,0.08);
    border-radius: 14px; padding: 14px 16px; text-align: left; cursor: pointer;
    font-size: 15px; font-weight: 600; color: var(--text); transition: all 0.2s;
    display: flex; align-items: center; gap: 12px;
  }
  .choice-btn:active:not(:disabled) { transform: scale(0.98); }
  .choice-letter {
    width: 30px; height: 30px; border-radius: 50%; background: rgba(255,255,255,0.08);
    display: flex; align-items: center; justify-content: center; font-size: 13px;
    font-weight: 800; flex-shrink: 0;
  }
  .choice-btn.correct { background: rgba(46,204,113,0.2); border-color: var(--green); }
  .choice-btn.correct .choice-letter { background: var(--green); color: white; }
  .choice-btn.wrong { background: rgba(231,76,60,0.2); border-color: var(--red); }
  .choice-btn.wrong .choice-letter { background: var(--red); color: white; }
  .choice-btn.reveal { background: rgba(46,204,113,0.1); border-color: rgba(46,204,113,0.4); }

  /* テキスト入力 */
  .text-input-area { margin-bottom: 16px; }
  .text-input-area input {
    width: 100%; padding: 14px 16px; background: var(--card2);
    border: 2px solid rgba(255,255,255,0.1); border-radius: 14px;
    color: var(--text); font-size: 16px; outline: none; margin-bottom: 10px;
  }
  .text-input-area input:focus { border-color: var(--accent); }
  .text-input-area input.correct { border-color: var(--green); background: rgba(46,204,113,0.1); }
  .text-input-area input.wrong { border-color: var(--red); background: rgba(231,76,60,0.1); }
  .submit-btn {
    width: 100%; padding: 14px; background: linear-gradient(135deg, #e91e8c, #9b59b6);
    border: none; border-radius: 14px; color: white; font-size: 16px; font-weight: 700; cursor: pointer;
  }
  .submit-btn:disabled { opacity: 0.5; }

  /* 穴埋め */
  .fill-blanks { font-size: 16px; line-height: 2.5; margin-bottom: 16px; }
  .blank-input {
    display: inline-block; width: 90px; padding: 2px 6px; background: var(--card2);
    border: 2px solid rgba(255,255,255,0.2); border-radius: 8px; color: var(--text);
    font-size: 14px; text-align: center; outline: none; vertical-align: middle;
  }
  .blank-input:focus { border-color: var(--accent); }
  .blank-input.correct { border-color: var(--green); background: rgba(46,204,113,0.15); }
  .blank-input.wrong { border-color: var(--red); background: rgba(231,76,60,0.15); color: var(--red); }

  /* フィードバック */
  .feedback-box {
    border-radius: 14px; padding: 14px 16px; margin-bottom: 14px;
    display: none; animation: fadeIn 0.3s ease;
  }
  @keyframes fadeIn { from{opacity:0;transform:translateY(8px)} to{opacity:1;transform:none} }
  .feedback-box.correct { background: rgba(46,204,113,0.15); border: 1px solid var(--green); }
  .feedback-box.wrong { background: rgba(231,76,60,0.12); border: 1px solid var(--red); }
  .fb-title { font-size: 16px; font-weight: 800; margin-bottom: 6px; }
  .fb-correct { color: var(--green); }
  .fb-wrong { color: var(--red); }
  .fb-detail { font-size: 13px; color: var(--sub); line-height: 1.7; }
  .fb-answer { color: var(--gold); font-weight: 700; }

  .next-btn {
    width: 100%; padding: 16px; background: linear-gradient(135deg, #e91e8c, #9b59b6);
    border: none; border-radius: 16px; color: white; font-size: 17px; font-weight: 700;
    cursor: pointer; display: none; margin-top: 4px;
  }

  /* ===== RESULT ===== */
  #result {
    align-items: center; text-align: center;
    background: radial-gradient(ellipse at top, #1a0533 0%, #0d0d1a 70%);
  }
  .result-trophy { font-size: 80px; margin: 20px 0; animation: float 3s ease-in-out infinite; }
  .result-score { font-size: 64px; font-weight: 900; }
  .result-max { font-size: 20px; color: var(--sub); margin-bottom: 8px; }
  .result-msg { font-size: 18px; font-weight: 700; margin-bottom: 28px; }
  .rank-badge {
    font-size: 13px; padding: 6px 20px; border-radius: 99px; margin-bottom: 32px;
    font-weight: 800; letter-spacing: 1px;
  }
  .rank-S { background: linear-gradient(135deg,#f1c40f,#e67e22); color: #000; }
  .rank-A { background: linear-gradient(135deg,#2ecc71,#27ae60); color: #000; }
  .rank-B { background: linear-gradient(135deg,#3498db,#2980b9); color: white; }
  .rank-C { background: rgba(255,255,255,0.1); color: var(--sub); }

  .result-detail { width: 100%; background: var(--card); border-radius: 16px; padding: 16px; margin-bottom: 20px; text-align: left; }
  .rd-row { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid rgba(255,255,255,0.06); font-size: 14px; }
  .rd-row:last-child { border: none; }
  .rd-label { color: var(--sub); }
  .rd-val { font-weight: 700; }

  /* ===== RECIPE LIST ===== */
  #recipelist { background: var(--bg); }
  .search-bar {
    background: var(--card); border: 1px solid var(--border); border-radius: 12px;
    padding: 10px 14px; color: var(--text); font-size: 15px; width: 100%; outline: none;
    margin-bottom: 14px;
  }
  .cat-filter { display: flex; gap: 8px; overflow-x: auto; margin-bottom: 14px; padding-bottom: 4px; scrollbar-width: none; }
  .cat-filter::-webkit-scrollbar { display: none; }
  .cat-tag {
    white-space: nowrap; padding: 6px 14px; border-radius: 99px; font-size: 12px; font-weight: 700;
    cursor: pointer; background: var(--card); border: 1px solid transparent; transition: all 0.2s; flex-shrink: 0;
  }
  .cat-tag.on { background: rgba(233,30,140,0.2); border-color: var(--accent); color: var(--accent); }

  .recipe-card {
    background: var(--card); border: 1px solid rgba(255,255,255,0.06); border-radius: 16px;
    padding: 14px 16px; margin-bottom: 10px; cursor: pointer; transition: all 0.2s;
  }
  .recipe-card:active { transform: scale(0.98); }
  .rc-top { display: flex; justify-content: space-between; align-items: flex-start; }
  .rc-name { font-size: 17px; font-weight: 800; }
  .rc-en { font-size: 12px; color: var(--sub); margin-top: 2px; }
  .rc-cat { font-size: 11px; padding: 2px 8px; border-radius: 99px; background: rgba(233,30,140,0.15); color: var(--accent); font-weight: 700; }
  .rc-body { margin-top: 10px; display: none; }
  .rc-body.open { display: block; animation: fadeIn 0.2s ease; }
  .rc-method { display: inline-block; font-size: 11px; padding: 2px 8px; border-radius: 99px; background: rgba(155,89,182,0.2); color: #bb8fce; font-weight: 700; margin-bottom: 8px; }
  .rc-glass { font-size: 12px; color: var(--sub); margin-bottom: 8px; }
  .ing-list { list-style: none; }
  .ing-list li { display: flex; justify-content: space-between; padding: 5px 0; border-bottom: 1px solid rgba(255,255,255,0.05); font-size: 13px; }
  .ing-list li:last-child { border: none; }
  .ing-name { color: var(--text); }
  .ing-amt { color: var(--gold); font-weight: 700; }
  .rc-note { font-size: 12px; color: #e67e22; margin-top: 8px; }
  .rc-garnish { font-size: 12px; color: var(--sub); margin-top: 4px; }

  /* ===== MISC ===== */
  .divider { height: 1px; background: rgba(255,255,255,0.07); margin: 8px 0 20px; }
  .shimmer { animation: shimmer 2s infinite; }
  @keyframes shimmer { 0%,100%{opacity:1}50%{opacity:0.6} }
</style>
</head>
<body>

<!-- ========== HOME ========== -->
<div id="home" class="screen active">
  <div class="logo-area">
    <div class="logo-icon">🌸</div>
    <div class="logo-title">FLOWERS</div>
    <div class="logo-sub">COCKTAIL QUIZ</div>
  </div>

  <div class="stats-row">
    <div class="stat-box">
      <div class="stat-num" id="totalCocktails">31</div>
      <div class="stat-label">レシピ数</div>
    </div>
    <div class="stat-box">
      <div class="stat-num" id="bestScore">—</div>
      <div class="stat-label">ベストスコア</div>
    </div>
    <div class="stat-box">
      <div class="stat-num" id="playCount">0</div>
      <div class="stat-label">プレイ回数</div>
    </div>
  </div>

  <button class="menu-btn btn-primary" onclick="showScreen('settings')">🍸 クイズ開始</button>
  <button class="menu-btn btn-secondary" onclick="showScreen('recipelist')">📖 レシピ一覧</button>
  <button class="menu-btn btn-gold" id="weakBtn" onclick="startWeakQuiz()" style="display:none">⚡ 苦手集中モード</button>
</div>

<!-- ========== SETTINGS ========== -->
<div id="settings" class="screen">
  <div class="page-header">
    <button class="back-btn" onclick="showScreen('home')">←</button>
    <div class="page-title">設定</div>
  </div>

  <div class="settings-section">
    <div class="section-label">カテゴリ</div>
    <div class="toggle-grid" id="categoryToggles"></div>
  </div>

  <div class="settings-section">
    <div class="section-label">問題タイプ</div>
    <div class="toggle-grid" id="typeToggles">
      <div class="toggle-item on" data-type="mc" onclick="toggleType(this)">
        <div class="ti-icon">🔘</div>4択選択
      </div>
      <div class="toggle-item on" data-type="text" onclick="toggleType(this)">
        <div class="ti-icon">⌨️</div>名前入力
      </div>
      <div class="toggle-item on" data-type="fill" onclick="toggleType(this)">
        <div class="ti-icon">✍️</div>分量穴埋め
      </div>
      <div class="toggle-item on" data-type="method" onclick="toggleType(this)">
        <div class="ti-icon">🥃</div>技法答え
      </div>
    </div>
  </div>

  <div class="settings-section">
    <div class="section-label">問題数</div>
    <div class="q-count-row" id="qCountRow">
      <div class="q-num" data-n="5" onclick="setQCount(this)">5問</div>
      <div class="q-num on" data-n="10" onclick="setQCount(this)">10問</div>
      <div class="q-num" data-n="20" onclick="setQCount(this)">20問</div>
      <div class="q-num" data-n="0" onclick="setQCount(this)">全問</div>
    </div>
  </div>

  <div style="margin-top: auto; padding-bottom: 20px;">
    <button class="menu-btn btn-primary" onclick="startQuiz()">🚀 スタート！</button>
  </div>
</div>

<!-- ========== QUIZ ========== -->
<div id="quiz" class="screen">
  <div class="quiz-header">
    <button class="back-btn" onclick="confirmExit()">←</button>
    <div class="quiz-progress-text" id="qProgressText">1 / 10</div>
    <div class="score-badge" id="scoreBadge">0点</div>
  </div>
  <div class="progress-bar-wrap">
    <div class="progress-bar-fill" id="progressFill" style="width:0%"></div>
  </div>
  <div id="quizContent"></div>
</div>

<!-- ========== RESULT ========== -->
<div id="result" class="screen">
  <div class="result-trophy" id="resultTrophy">🏆</div>
  <div class="result-score" id="resultScore">0</div>
  <div class="result-max" id="resultMax">/ 0点</div>
  <div class="rank-badge" id="resultRank">C</div>
  <div class="result-msg" id="resultMsg">お疲れ様でした！</div>

  <div class="result-detail" id="resultDetail"></div>

  <button class="menu-btn btn-primary" onclick="startQuiz()">🔄 もう一度</button>
  <button class="menu-btn btn-secondary" onclick="showScreen('home')">🏠 ホームへ</button>
</div>

<!-- ========== RECIPE LIST ========== -->
<div id="recipelist" class="screen">
  <div class="page-header">
    <button class="back-btn" onclick="showScreen('home')">←</button>
    <div class="page-title">レシピ一覧</div>
  </div>
  <input type="search" class="search-bar" placeholder="🔍 カクテルを検索..." id="searchInput" oninput="renderRecipes()">
  <div class="cat-filter" id="catFilter"></div>
  <div id="recipeListContent"></div>
</div>

  weakMode: false,
  weakIds: new Set(),
  history: [], // {id, correct}
  playCount: 0,
  bestScore: 0,
  bestMax: 0
};

function loadState() {
  try {
    const s = JSON.parse(localStorage.getItem('flowersState')||'{}');
    if(s.weakIds) state.weakIds = new Set(s.weakIds);
    if(s.playCount) state.playCount = s.playCount;
    if(s.bestScore !== undefined) { state.bestScore = s.bestScore; state.bestMax = s.bestMax||0; }
  } catch(e){}
}
function saveState() {
  localStorage.setItem('flowersState', JSON.stringify({
    weakIds: [...state.weakIds],
    playCount: state.playCount,
    bestScore: state.bestScore,
    bestMax: state.bestMax
  }));
}

// ========== SCREEN ==========

  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  if(id==='home') updateHome();
  if(id==='settings') buildSettings();

}

  document.getElementById('playCount').textContent = state.playCount;
  if(state.bestMax > 0) {
    document.getElementById('bestScore').textContent = state.bestScore + '/' + state.bestMax;
  }

// ========== SETTINGS ==========
function buildSettings() {
  const catGrid = document.getElementById('categoryToggles');
  catGrid.innerHTML = '';
  const icons = {'Gin Base':'🍸','Vodka Base':'🥂','Whisky Base':'🥃','Rum & Tequila':'🍹','Liqueur Base':'🍒','Signature':'⭐','Mocktail':'🧃'};
  allCats.forEach(cat=>{
    const on = state.selCats.has(cat);
    const el = document.createElement('div');
    el.className = 'toggle-item' + (on?' on':'');
    el.innerHTML = `<div class="ti-icon">${icons[cat]||'🍸'}</div>${cat}`;
    el.onclick = ()=>{
      if(state.selCats.has(cat)) { if(state.selCats.size>1) state.selCats.delete(cat); }
      else state.selCats.add(cat);
      buildSettings();
    };
    catGrid.appendChild(el);
  });
}
function toggleType(el) {
  const t = el.dataset.type;
  if(el.classList.contains('on')) {
    if(state.selTypes.size > 1) { state.selTypes.delete(t); el.classList.remove('on'); }
  } else {
    state.selTypes.add(t); el.classList.add('on');
  }
}
function setQCount(el) {
  document.querySelectorAll('.q-num').forEach(e=>e.classList.remove('on'));
  el.classList.add('on');
  state.qCount = parseInt(el.dataset.n);
}

// ========== QUIZ GENERATION ==========
function shuffle(arr) { return [...arr].sort(()=>Math.random()-0.5); }
function rand(arr) { return arr[Math.floor(Math.random()*arr.length)]; }

function generateQuestions(pool) {
  const types = [...state.selTypes];
  const qs = [];
  const shuffled = shuffle(pool);
  const n = state.qCount === 0 ? shuffled.length : Math.min(state.qCount, shuffled.length);

  for(let i=0; i<n; i++){
    const c = shuffled[i];
    const t = rand(types);
    qs.push(buildQuestion(c, t, pool));
  }
  return qs;
}

function buildQuestion(c, type, pool) {
  const others = pool.filter(x=>x.id!==c.id);

  if(type==='mc') {
    // 4択: カクテル名を当てる
    const subtypes = ['ingredients','glass','method'];
    const sub = rand(subtypes.filter(s=>{
      if(s==='method') return true;
      if(s==='glass') return true;
      return c.ingredients.length > 0;
    }));

    if(sub==='ingredients') {
      const mainIng = c.ingredients[0].n;
      const wrongs = shuffle(others.map(o=>o.name)).slice(0,3);
      const choices = shuffle([c.name, ...wrongs]);
      return { type:'mc', cocktail:c, subtype:'ingredients',
        question:`<span class="highlight">${mainIng}</span> が入るカクテルは？`,
        choices, answer: c.name };
    } else if(sub==='glass') {
      const wrongs = shuffle(others.map(o=>o.name)).slice(0,3);
      const choices = shuffle([c.name, ...wrongs]);
      return { type:'mc', cocktail:c, subtype:'glass',
        question:`<span class="highlight">${c.glass}</span> で提供するカクテルは？（1つ）`,
        choices, answer: c.name };
    } else {
      const wrongs = shuffle(others.filter(o=>o.method!==c.method).map(o=>o.method));
      const methodChoices = shuffle([c.method, ...wrongs.slice(0,3)]);
      return { type:'mc', cocktail:c, subtype:'method',
        question:`<span class="highlight">${c.name}</span> の技法は？`,
        choices: methodChoices, answer: c.method };
    }

  } else if(type==='text') {
    // 材料1つを見てカクテル名を答える
    const mainIng = c.ingredients[0].n;
    return { type:'text', cocktail:c,
      question:`<span class="highlight">${mainIng}</span> を使ったカクテル名を入力してください`,
      answer: c.name };

  } else if(type==='fill') {
    // 分量穴埋め (1〜2個)
    const ing = rand(c.ingredients);
    return { type:'fill', cocktail:c,
      question:`<span class="highlight">${c.name}</span> のレシピを完成させてください`,
      blankIng: ing, answer: ing.a };

  } else { // method
    const wrongs = shuffle([...new Set(pool.map(x=>x.method))].filter(m=>m!==c.method)).slice(0,3);
    const choices = shuffle([c.method, ...wrongs]);
    return { type:'mc', cocktail:c, subtype:'method',
      question:`<span class="highlight">${c.name}</span> の技法は？`,
      choices, answer: c.method };
  }
}

// ========== START ==========
function startQuiz() {
  const pool = cocktails.filter(c=>state.selCats.has(c.cat));
  if(pool.length === 0) { alert('カテゴリを1つ以上選んでください'); return; }

  state.questions = generateQuestions(pool);
  state.current = 0;
  state.score = 0;
  state.answered = false;
  state.history = [];
  state.weakMode = false;

  showScreen('quiz');
  renderQuestion();
}

function startWeakQuiz() {
  const pool = cocktails.filter(c=>state.weakIds.has(c.id));
  if(pool.length === 0) { alert('苦手なカクテルがありません'); return; }
  state.selCats = new Set(pool.map(c=>c.cat));
  state.questions = generateQuestions(pool);
  state.current = 0;
  state.score = 0;
  state.answered = false;
  state.history = [];
  state.weakMode = true;

  showScreen('quiz');
  renderQuestion();
}

// ========== RENDER QUESTION ==========
function renderQuestion() {
  const q = state.questions[state.current];
  const total = state.questions.length;
  state.answered = false;

  document.getElementById('qProgressText').textContent = `${state.current+1} / ${total}`;
  document.getElementById('scoreBadge').textContent = `${state.score}点`;
  document.getElementById('progressFill').style.width = `${(state.current/total)*100}%`;

  let html = '';

  // badge
  const badgeMap = {mc:'badge-mc', text:'badge-text', fill:'badge-fill'};
  const labelMap = {mc:'4択', text:'入力', fill:'穴埋め'};
  html += `<span class="q-type-badge ${badgeMap[q.type]||'badge-mc'}">${labelMap[q.type]||'4択'}</span>`;

  // question card
  html += `<div class="q-card"><div class="q-label">Q${state.current+1}.</div><div class="q-text">${q.question}</div></div>`;

  if(q.type==='mc') {
    html += '<div class="choices">';
    const letters = ['A','B','C','D'];
    q.choices.forEach((ch,i)=>{
      html += `<button class="choice-btn" onclick="answerMC(this,'${escQ(ch)}','${escQ(q.answer)}')" data-val="${escQ(ch)}">
        <span class="choice-letter">${letters[i]}</span>${ch}</button>`;
    });
    html += '</div>';

  } else if(q.type==='text') {
    html += `<div class="text-input-area">
      <input type="text" id="textAnswer" placeholder="カクテル名を入力..." autocomplete="off">
      <button class="submit-btn" onclick="answerText('${escQ(q.answer)}')">確認 →</button>
    </div>`;

  } else if(q.type==='fill') {
    // 材料一覧 + 1つ空白
    html += '<div class="fill-blanks"><b>材料リスト：</b><br>';
    q.cocktail.ingredients.forEach(ing=>{
      if(ing.n === q.blankIng.n) {
        html += `${ing.n}：<input class="blank-input" id="fillAnswer" type="text" placeholder="?" autocomplete="off"> `;
      } else {
        html += `${ing.n}：<span style="color:var(--gold);font-weight:700">${ing.a}</span>  `;
      }
    });
    html += '</div>';
    html += `<button class="submit-btn" onclick="answerFill('${escQ(q.answer)}')">確認 →</button>`;
  }

  // feedback
  html += '<div class="feedback-box" id="feedbackBox"><div class="fb-title" id="fbTitle"></div><div class="fb-detail" id="fbDetail"></div></div>';
  html += '<button class="next-btn" id="nextBtn" onclick="nextQuestion()">次の問題 →</button>';

  document.getElementById('quizContent').innerHTML = html;

  // auto focus
  setTimeout(()=>{
    const inp = document.getElementById('textAnswer') || document.getElementById('fillAnswer');
    if(inp) inp.focus();
  }, 300);
}

function escQ(s){ return (s||'').replace(/'/g,"\\'").replace(/"/g,'&quot;'); }

// ========== ANSWERS ==========
function answerMC(btn, chosen, answer) {
  if(state.answered) return;
  state.answered = true;
  const btns = document.querySelectorAll('.choice-btn');
  btns.forEach(b=>b.disabled=true);

  const correct = chosen === answer;
  if(correct) {
    btn.classList.add('correct');
    showFeedback(true, state.questions[state.current]);
  } else {
    btn.classList.add('wrong');
    btns.forEach(b=>{ if(b.dataset.val===answer) b.classList.add('reveal'); });
    showFeedback(false, state.questions[state.current]);
  }
  recordAnswer(correct);
}

function answerText(answer) {
  if(state.answered) return;
  const inp = document.getElementById('textAnswer');
  if(!inp || !inp.value.trim()) return;
  state.answered = true;
  inp.disabled = true;
  document.querySelector('.submit-btn').disabled = true;

  const val = inp.value.trim();
  const correct = normalizeInput(val) === normalizeInput(answer);
  inp.classList.add(correct?'correct':'wrong');
  recordAnswer(correct);
  showFeedback(correct, state.questions[state.current]);
}

function answerFill(answer) {
  if(state.answered) return;
  const inp = document.getElementById('fillAnswer');
  if(!inp || !inp.value.trim()) return;
  state.answered = true;
  inp.disabled = true;
  document.querySelector('.submit-btn').disabled = true;

  const val = inp.value.trim();
  const correct = normalizeInput(val) === normalizeInput(answer);
  inp.classList.add(correct?'correct':'wrong');
  if(!correct) inp.value = answer;
  recordAnswer(correct);
  showFeedback(correct, state.questions[state.current]);
}

function normalizeInput(s) {
  return s.toLowerCase()
    .replace(/[・‐－ー]/g,'')
    .replace(/\s/g,'')
    .replace(/[Ａ-Ｚａ-ｚ０-９]/g, c=>String.fromCharCode(c.charCodeAt(0)-0xFEE0))
    .trim();
}

function recordAnswer(correct) {
  const c = state.questions[state.current].cocktail;
  if(correct) {
    state.score += 10;
    state.weakIds.delete(c.id);
  } else {
    state.weakIds.add(c.id);
  }
  state.history.push({ id:c.id, name:c.name, correct });
}

function showFeedback(correct, q) {
  const box = document.getElementById('feedbackBox');
  const title = document.getElementById('fbTitle');
  const detail = document.getElementById('fbDetail');
  box.style.display = 'block';
  box.className = 'feedback-box ' + (correct?'correct':'wrong');

  if(correct) {
    title.innerHTML = '<span class="fb-correct">✅ 正解！</span>';
  } else {
    title.innerHTML = `<span class="fb-wrong">❌ 不正解</span>`;
  }

  const c = q.cocktail;
  let d = `<b>${c.name}</b>（${c.nameEn}）<br>`;
  d += `🥃 グラス：${c.glass}　技法：<span class="fb-answer">${c.method}</span><br>`;
  d += `材料：`;
  d += c.ingredients.map(i=>`${i.n} <span class="fb-answer">${i.a}</span>`).join('、');
  if(c.garnish) d += `<br>🌿 ガーニッシュ：${c.garnish}`;
  if(c.note) d += `<br>⚠️ ${c.note}`;
  detail.innerHTML = d;

  document.getElementById('nextBtn').style.display = 'block';
}

function nextQuestion() {
  state.current++;
  if(state.current >= state.questions.length) {
    showResult();
  } else {
    renderQuestion();
  }
}

function confirmExit() {
  if(!state.answered && state.current>0) {
    if(!confirm('クイズを終了しますか？')) return;
  }
  showScreen('home');
}

// ========== RESULT ==========
function showResult() {
  const total = state.questions.length * 10;
  const pct = total > 0 ? state.score / total : 0;

  state.playCount++;
  if(state.score > state.bestScore || (state.score === state.bestScore && total > state.bestMax)) {
    state.bestScore = state.score; state.bestMax = total;
  }
  saveState();

  let rank, trophy, msg;
  if(pct >= 0.9) { rank='S'; trophy='🏆'; msg='パーフェクト！プロの腕前です！'; }
  else if(pct >= 0.7) { rank='A'; trophy='🥇'; msg='素晴らしい！よく覚えています！'; }
  else if(pct >= 0.5) { rank='B'; trophy='🥈'; msg='まあまあ！もう少し練習しましょう！'; }
  else { rank='C'; trophy='🥉'; msg='まだまだ！繰り返し練習しましょう！'; }

  document.getElementById('resultTrophy').textContent = trophy;
  document.getElementById('resultScore').textContent = state.score;
  document.getElementById('resultMax').textContent = `/ ${total}点`;
  document.getElementById('resultMsg').textContent = msg;

  const rb = document.getElementById('resultRank');
  rb.textContent = `RANK ${rank}`;
  rb.className = `rank-badge rank-${rank}`;

  const correct = state.history.filter(h=>h.correct).length;
  const wrong = state.history.filter(h=>!h.correct).length;

  let det = `
    <div class="rd-row"><span class="rd-label">正解数</span><span class="rd-val" style="color:var(--green)">${correct}問</span></div>
    <div class="rd-row"><span class="rd-label">不正解数</span><span class="rd-val" style="color:var(--red)">${wrong}問</span></div>
    <div class="rd-row"><span class="rd-label">正答率</span><span class="rd-val">${Math.round(pct*100)}%</span></div>
  `;
  if(state.weakIds.size > 0) {
    det += `<div class="rd-row"><span class="rd-label">苦手リスト</span><span class="rd-val" style="color:var(--accent)">${state.weakIds.size}件</span></div>`;
  }
  if(wrong > 0) {
    const wNames = state.history.filter(h=>!h.correct).map(h=>h.name).join('、');
    det += `<div class="rd-row" style="flex-direction:column;gap:4px"><span class="rd-label">間違えたカクテル</span><span class="rd-val" style="color:var(--red);font-size:13px">${wNames}</span></div>`;
  }
  document.getElementById('resultDetail').innerHTML = det;

  showScreen('result');
}

  const cf = document.getElementById('catFilter');

  });

  document.querySelectorAll('.cat-tag').forEach(e=>e.classList.remove('on'));

  recipeFilter = cat;
  renderRecipes();
}

  let html = '';
  pool.forEach(c=>{
    html += `<div class="recipe-card" onclick="toggleRecipe(this)">
      <div class="rc-top">
        <div>
          <div class="rc-name">${c.name}</div>
          <div class="rc-en">${c.nameEn}</div>
        </div>

      </div>
      <div class="rc-body">
        <span class="rc-method">${c.method}</span>
        <div class="rc-glass">🥃 ${c.glass}</div>
        <ul class="ing-list">
          ${c.ingredients.map(i=>`<li><span class="ing-name">${i.n}</span><span class="ing-amt">${i.a}</span></li>`).join('')}
        </ul>
        ${c.garnish?`<div class="rc-garnish">🌿 ${c.garnish}</div>`:''}
        ${c.note?`<div class="rc-note">⚠️ ${c.note}</div>`:''}
      </div>
    </div>`;
  });
  document.getElementById('recipeListContent').innerHTML = html || '<div style="color:var(--sub);text-align:center;padding:40px">該当するカクテルがありません</div>';
}
function toggleRecipe(el) {
  const body = el.querySelector('.rc-body');
  body.classList.toggle('open');
}

// ========== INIT ==========
loadState();
updateHome();
buildSettings();
</script>
</body>
</html>
